name: Python Security

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to set up.
        required: false
        type: string
        default: "3.14"
      uv-version:
        description: uv version to install.
        required: false
        type: string
        default: "0.12.5"
      install-extras:
        description: Space-separated extras expanded into repeated --extra flags on uv sync --frozen. The dev group arrives automatically via [tool.uv] default-groups.
        required: false
        type: string
        default: "tracing"
      runs-on:
        description: Runner label for the security job.
        required: false
        type: string
        default: "ubuntu-latest"
      run-trufflehog:
        description: Whether to run the TruffleHog secret-scanning step.
        required: false
        type: boolean
        default: true
      trufflehog-pr-diff:
        description: When true, scan only the PR diff (base/head SHAs); when false, scan the full checkout.
        required: false
        type: boolean
        default: false
      trufflehog-extra-args:
        description: Extra args forwarded to the TruffleHog action's extra_args input.
        required: false
        type: string
        default: ""
      run-pip-audit:
        description: Whether to run the pip-audit dependency vulnerability step.
        required: false
        type: boolean
        default: true
      pip-audit-requirements-file:
        description: When non-empty, uv export to this path and audit it with pip-audit -r; when empty, run uv run pip-audit against the synced env.
        required: false
        type: string
        default: ""
      pip-audit-ignore-packages:
        description: Space-separated package names expanded into repeated --no-emit-package flags on the uv export step (only used when pip-audit-requirements-file is set).
        required: false
        type: string
        default: ""
      pip-audit-ignore-vulns:
        description: DEPRECATED — list the ids in audit-ignore-file instead (emits a warning when set). Space- or comma-separated vuln IDs merged with audit-ignore-file and expanded into repeated --ignore-vuln flags on pip-audit.
        required: false
        type: string
        default: ""
      audit-ignore-file:
        description: Repo-relative path of the single-source advisory ignore file shared with python-ci.yml (one "ID  # reason" per line, optional "# expires: YYYY-MM-DD"). Ids become repeated --ignore-vuln flags on pip-audit. A missing file means no advisories are ignored; an expired entry fails the audit.
        required: false
        type: string
        default: ".audit-ignore"

permissions:
  contents: read

jobs:
  security:
    name: Security
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          # PR-diff TruffleHog needs full history to resolve base..head.
          fetch-depth: 0
          # Audits only read the checked-out tree; no git push.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ inputs.uv-version }}

      # TruffleHog runs BEFORE the dependency install: `uv sync` with
      # UV_PROJECT_ENVIRONMENT=system creates a ./system venv inside the
      # workspace, and the full scan (path: ./) then audits third-party
      # package code — hexarchy's weekly scan failed on two unverified URI
      # findings that exist only inside installed dependencies
      # (hexarchy run 33363927943; a clean-clone scan finds nothing).
      - name: TruffleHog (PR diff scan)
        if: ${{ inputs.run-trufflehog && inputs.trufflehog-pr-diff && github.event_name == 'pull_request' }}
        # Pin: human follow-up — confirm/refresh this SHA against the
        # intended trufflesecurity/trufflehog release (resolved offline).
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341  # v3.99.0
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: ${{ inputs.trufflehog-extra-args }}

      - name: TruffleHog (full scan)
        if: ${{ inputs.run-trufflehog && !inputs.trufflehog-pr-diff }}
        # Pin: human follow-up — confirm/refresh this SHA against the
        # intended trufflesecurity/trufflehog release (resolved offline).
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341  # v3.99.0
        with:
          path: ./
          extra_args: ${{ inputs.trufflehog-extra-args }}

      - name: Install deps
        # Installs from the committed uv.lock; --frozen fails the build
        # if the lock is stale relative to pyproject.toml. Inputs are
        # passed via env, not inline ``${{ }}`` interpolation into the
        # run block, to avoid template injection (zizmor).
        run: |
          extras=""
          # shellcheck disable=SC2086
          for x in $INSTALL_EXTRAS; do
            extras="$extras --extra $x"
          done
          # shellcheck disable=SC2086
          uv sync --frozen $extras
        env:
          UV_PROJECT_ENVIRONMENT: system
          INSTALL_EXTRAS: ${{ inputs.install-extras }}

      # Runs after TruffleHog so the full secret scan never sees the
      # library checkout; each pip-audit step removes it on exit.
      - name: Checkout workflow library (audit-ignore parser)
        if: ${{ inputs.run-pip-audit }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: damien-robotsix/robotsix-github-workflows
          ref: ${{ github.job_workflow_sha }}
          path: _workflow-lib
          persist-credentials: false

      - name: pip-audit (locked requirements file)
        if: ${{ inputs.run-pip-audit && inputs.pip-audit-requirements-file != '' }}
        # Inputs flow through env, never inline into the run block, to
        # avoid template injection (zizmor).  Ignored ids come from the
        # single-source audit-ignore-file (scripts/audit_ignore.py), merged
        # with the deprecated pip-audit-ignore-vulns input.
        env:
          UV_PROJECT_ENVIRONMENT: system
          PIP_AUDIT_REQUIREMENTS_FILE: ${{ inputs.pip-audit-requirements-file }}
          PIP_AUDIT_IGNORE_PACKAGES: ${{ inputs.pip-audit-ignore-packages }}
          PIP_AUDIT_IGNORE_VULNS: ${{ inputs.pip-audit-ignore-vulns }}
          AUDIT_IGNORE_FILE: ${{ inputs.audit-ignore-file }}
        run: |
          trap 'rm -rf _workflow-lib' EXIT
          no_emit=""
          # shellcheck disable=SC2086
          for p in $PIP_AUDIT_IGNORE_PACKAGES; do
            no_emit="$no_emit --no-emit-package $p"
          done
          # shellcheck disable=SC2086
          uv export --frozen --no-emit-project $no_emit -o "$PIP_AUDIT_REQUIREMENTS_FILE"
          python3 _workflow-lib/scripts/audit_ignore.py \
            --file "$AUDIT_IGNORE_FILE" --extra "$PIP_AUDIT_IGNORE_VULNS" --format pip-audit -- \
            uv run --with pip-audit pip-audit -r "$PIP_AUDIT_REQUIREMENTS_FILE"

      - name: pip-audit (synced environment)
        if: ${{ inputs.run-pip-audit && inputs.pip-audit-requirements-file == '' }}
        env:
          UV_PROJECT_ENVIRONMENT: system
          PIP_AUDIT_IGNORE_VULNS: ${{ inputs.pip-audit-ignore-vulns }}
          AUDIT_IGNORE_FILE: ${{ inputs.audit-ignore-file }}
        run: |
          trap 'rm -rf _workflow-lib' EXIT
          python3 _workflow-lib/scripts/audit_ignore.py \
            --file "$AUDIT_IGNORE_FILE" --extra "$PIP_AUDIT_IGNORE_VULNS" --format pip-audit -- \
            uv run --with pip-audit pip-audit

      - name: Generate SBOM (CycloneDX)
        if: always()
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run --with pip-audit pip-audit --format cyclonedx-json --output sbom.json || true

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: warn
