name: Deps Bump

# Thin wrapper around the shared bump workflow.  Delegates to
# .github/workflows/bump.yml with bump-mode=deps.
#
# Retained as a separate entry point so callers can reference a
# self-documenting workflow name.  All logic lives in the shared
# bump.yml — no app-auth or job-skeleton duplication.

on:
  workflow_call:
    inputs:
      packages:
        description: >
          Space-separated list of first-party package names to upgrade,
          e.g. "robotsix-mill robotsix-llmio". Each name becomes a
          separate --upgrade-package flag on uv lock.
        required: true
        type: string
      uv-version:
        description: uv version to install.
        required: false
        type: string
        default: "0.8.15"
      default-branch:
        description: Base branch for the PR and the git push target.
        required: false
        type: string
        default: "main"
      bump-branch:
        description: >
          Branch to force-push the bump commit to. Stable name → repeated
          runs overwrite; an open PR on the branch is detected and reused
          rather than duplicated.
        required: false
        type: string
        default: "deps-bump/first-party"
      app-id:
        description: >
          GitHub App ID used to mint an installation token for the
          bump push (pair with the app-private-key secret). The app
          must be installed on the repo with contents:write and
          pull-requests:write.
        required: true
        type: string
      permission-contents:
        description: >
          Permission scope for the minted token's repository contents
          (push bump branch).
        required: false
        type: string
        default: "write"
      permission-pull-requests:
        description: >
          Permission scope for the minted token's pull requests
          (create/update PRs).
        required: false
        type: string
        default: "write"
    secrets:
      app-private-key:
        description: >
          PEM private key of the GitHub App named by the app-id
          input. Required when app-id is set.
        required: true

jobs:
  bump:
    name: Bump
    uses: ./.github/workflows/bump.yml
    with:
      bump-mode: deps
      packages: ${{ inputs.packages }}
      uv-version: ${{ inputs.uv-version }}
      default-branch: ${{ inputs.default-branch }}
      bump-branch: ${{ inputs.bump-branch }}
      app-id: ${{ inputs.app-id }}
      permission-contents: ${{ inputs.permission-contents }}
      permission-pull-requests: ${{ inputs.permission-pull-requests }}
    secrets:
      app-private-key: ${{ secrets.app-private-key }}