name: Docker PR Scan

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to the Dockerfile, relative to the repository root.
        required: false
        type: string
        default: "./Dockerfile"
      image-name:
        description: >
          Base image name, e.g. `ghcr.io/<owner>/<repo>` or
          `ghcr.io/<owner>/<repo>-sandbox`. When empty (the default),
          falls back to `ghcr.io/<owner>/<repo>` for the calling repository.
        required: false
        type: string
        default: ""
      use-gha-cache:
        description: >
          Whether to use the GitHub Actions layer cache (`cache-from`/`cache-to`).
          For large images (multi-GB), the GHA cache can add 45-55 minutes per
          run — time both paths on the actual image before enabling.
        required: false
        type: boolean
        default: true
      smoke:
        description: >
          Whether to run the post-build smoke test that executes the built
          image once to prove its entrypoint can `exec`. Set to `false` to
          skip for repos whose image legitimately cannot be run in CI.
        required: false
        type: boolean
        default: true
      smoke_command:
        description: >
          Command run inside the built image to smoke-test it, via `sh -c`
          (e.g. `python -c "import mypkg"`). When empty (the default), the
          test execs the image's own entrypoint/CMD binary with `--help`,
          deriving it from the image config.
        required: false
        type: string
        default: ""
      strip-pip:
        description: >
          Whether the hardening layer uninstalls pip (and removes its
          site-packages / bin leftovers) from any python3 in the image. The
          base image's own pip vendors a certifi that trips the Trivy gate
          (GHSA-6q48-6c7w-9gw2 on python:3.14-slim); fleet runtime images run
          from uv-built venvs and never call pip. Set to `false` for images
          that need pip at runtime. Images without python are unaffected.
        required: false
        type: boolean
        default: true
      runs-on:
        description: >
          Runner label for the job (e.g. `self-hosted` for zero billed
          minutes). Defaults to `ubuntu-latest`.
        required: false
        type: string
        default: "ubuntu-latest"
      trivy-db-repository:
        description: >
          OCI repository Trivy downloads its vulnerability DB from, exported
          as `TRIVY_DB_REPOSITORY` to every Trivy step. Defaults to empty,
          which leaves Trivy on its built-in default source. Opt in to the
          ghcr.io mirror (`ghcr.io/aquasecurity/trivy-db:2`), e.g. to avoid
          the mirror.gcr.io download hanging on self-hosted runners.
        required: false
        type: string
        default: ""
      trivy-java-db-repository:
        description: >
          OCI repository Trivy downloads its Java DB from, exported as
          `TRIVY_JAVA_DB_REPOSITORY` to every Trivy step. Defaults to empty,
          which leaves Trivy on its built-in default source. Opt in to the
          ghcr.io mirror with `ghcr.io/aquasecurity/trivy-java-db:1`.
        required: false
        type: string
        default: ""
      upload-sarif:
        description: >
          Whether to run the Trivy SARIF scan and upload it to GitHub Code
          Scanning. The upload is always skipped for private repositories
          (code-scanning upload is rejected without GitHub Advanced
          Security), regardless of this input.
        required: false
        type: boolean
        default: true
      trivyignores:
        description: >
          Trivy ignore file passed explicitly to both the gate and the SARIF
          scans, relative to the repository root. When the file does not
          exist it is skipped (no ignore file is passed), so repos without a
          `.trivyignore` need not override the default.
        required: false
        type: string
        default: ".trivyignore"
      build-args:
        description: >
          Newline-separated `NAME=value` build arguments passed to the
          component Dockerfile build (docker/build-push-action `build-args`).
          Not for secrets — build args are recorded in the image history;
          use the `build-secrets` secret instead.
        required: false
        type: string
        default: ""
      github-token-secret-id:
        description: >
          When non-empty, exposes the job's `GITHUB_TOKEN` to the component
          Dockerfile build as a BuildKit secret with this id (consumed via
          `RUN --mount=type=secret,id=<id>`). Empty (the default) passes no
          token.
        required: false
        type: string
        default: ""
    secrets:
      build-secrets:
        description: >
          Optional newline-separated `id=value` BuildKit secrets passed to
          the component Dockerfile build (docker/build-push-action
          `secrets`), consumed via `RUN --mount=type=secret,id=<id>`.
        required: false

permissions:
  contents: read

jobs:
  scan:
    name: Scan
    runs-on: ${{ inputs.runs-on }}
    env:
      # Trivy DB mirrors, read by every Trivy step (gate and SARIF). Empty
      # values are ignored by Trivy, which then uses its built-in default.
      TRIVY_DB_REPOSITORY: ${{ inputs.trivy-db-repository }}
      TRIVY_JAVA_DB_REPOSITORY: ${{ inputs.trivy-java-db-repository }}
    permissions:
      contents: read
      security-events: write  # SARIF upload to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Resolve local image ref
        id: image-ref
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          BASE="${INPUT_IMAGE_NAME:-ghcr.io/$GITHUB_REPOSITORY}"
          echo "image=${BASE}:pr-scan" >> "$GITHUB_OUTPUT"
          echo "base-image=${BASE}:pr-scan-base" >> "$GITHUB_OUTPUT"

      # Stage 1 of the fleet-wide security-hardening build: build the
      # component's own Dockerfile into the local daemon (no push). The
      # scanned image (Stage 2) is layered on top of this.
      - name: Build base image (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.image-ref.outputs.base-image }}
          cache-from: ${{ inputs.use-gha-cache && 'type=gha' || '' }}
          cache-to: ${{ inputs.use-gha-cache && 'type=gha,mode=max' || '' }}
          build-args: ${{ inputs.build-args }}
          secrets: |
            ${{ inputs.github-token-secret-id != '' && format('{0}={1}', inputs.github-token-secret-id, secrets.GITHUB_TOKEN) || '' }}
            ${{ secrets.build-secrets }}

      # Read the base image's configured USER so the hardening layer can run
      # apt as root and then restore the original user.
      - name: Inspect base image config
        env:
          BASE_TAG: ${{ steps.image-ref.outputs.base-image }}
        run: |
          docker inspect --format '{{json .Config}}' "$BASE_TAG" > /tmp/base-config.json

      # The render script lives in THIS repo, not the caller's checkout where a
      # reusable workflow's `run:` steps execute — hence a composite action.
      - name: Render hardening Dockerfile
        uses: damien-robotsix/robotsix-github-workflows/.github/actions/render-harden@601fed52b4c4aac803970886c63e4a61ad474fe9
        with:
          base-ref: ${{ steps.image-ref.outputs.base-image }}
          config: /tmp/base-config.json
          out: /tmp/harden/Dockerfile
          strip-pip: ${{ inputs.strip-pip }}

      # Stage 2: layer the apt security upgrade on top and load the result as
      # the image the Trivy gate scans, so the scan reflects the patched
      # packages (e.g. perl-base >= 5.40.1-6+deb13u1) that the published image
      # will carry. Built on the `default` (docker) builder so it can resolve
      # `FROM <locally-loaded base>` from the daemon image store.
      - name: Build hardened image (local)
        env:
          SCAN_IMAGE: ${{ steps.image-ref.outputs.image }}
        run: |
          docker buildx build --builder default --load \
            -t "$SCAN_IMAGE" \
            -f /tmp/harden/Dockerfile /tmp/harden

      # Smoke test: execute the freshly built image once so an image that
      # builds and scans green but cannot `exec` at runtime (e.g. a dangling
      # venv python symlink after a requires-python bump) fails the job here
      # instead of crash-looping after deployment. Nothing else in this
      # pipeline runs the image. The composite action runs
      # scripts/smoke_image.py from THIS repo's checkout; the base image
      # config supplies the Entrypoint/CMD the default --help probe derives.
      - name: Smoke-test image
        if: ${{ inputs.smoke }}
        uses: damien-robotsix/robotsix-github-workflows/.github/actions/docker-smoke@3ef16cd77ef938725fac99400d70027de5e5a6b0
        with:
          image: ${{ steps.image-ref.outputs.image }}
          config: /tmp/base-config.json
          command: ${{ inputs.smoke_command }}

      # Gate: CRITICAL and HIGH fixable CVEs block the pipeline. Runs in
      # table format so the failing CVE row is visible in the CI log
      # (SARIF mode would silently swallow it — see below).
      - name: Trivy vulnerability scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.image-ref.outputs.image }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: ${{ hashFiles(inputs.trivyignores) != '' && inputs.trivyignores || '' }}

      # Code-scanning surface: separate Trivy run that emits SARIF for
      # all severities (no exit-code). The two steps MUST stay separate:
      # the trivy-action's entrypoint unsets TRIVY_SEVERITY when
      # format=sarif (unless limit-severities-for-sarif=true), so
      # combining gate + SARIF into one step would silently scan for
      # ALL severities and fail on HIGH/MEDIUM findings the gate is
      # supposed to ignore. `if: always()` so we still surface findings
      # in the Security tab even when the gate above trips.
      # Skipped for private repos: code-scanning upload is rejected without
      # GitHub Advanced Security, so the scan + upload would be wasted work.
      - name: Trivy vulnerability scan (SARIF for code-scanning)
        if: ${{ inputs.upload-sarif && !github.event.repository.private }}
        uses: damien-robotsix/robotsix-github-workflows/.github/actions/trivy-sarif@41b2b7f12c390ceb135effe8440ad8f3ef7e9940
        with:
          image-ref: ${{ steps.image-ref.outputs.image }}
          ignore-unfixed: true
          trivyignores: ${{ hashFiles(inputs.trivyignores) != '' && inputs.trivyignores || '' }}
