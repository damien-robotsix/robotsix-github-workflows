name: Config Ownership Check

on:
  workflow_call:
    inputs:
      deploy-config-glob:
        description: >-
          Space-separated glob patterns for deploy-plane config files
          to scan.  Only files matching these patterns are checked.
        required: false
        type: string
        default: "deploy/**/*.{yml,yaml} **/docker-compose*.{yml,yaml} kubernetes/**/*.{yml,yaml} helm/**/*.{yml,yaml}"
      orchestration-only-patterns:
        description: >-
          Newline-separated regex patterns (Python re syntax) for env
          var / config key names that are orchestration-only and
          therefore allowed in deploy-plane config.  One pattern per
          line; lines starting with # are comments.  When empty or
          unset, a conservative built-in default set is used.
        required: false
        type: string
        default: ""
      ui-config-glob:
        description: >-
          Space-separated glob patterns for central-deploy UI config
          files.  Only checked when non-empty — most repos do not
          host a central deploy UI and should leave this empty.
        required: false
        type: string
        default: ""
      base-ref:
        description: >-
          Git ref to diff against.  When empty, the merge-base with
          origin/main (or main) is used automatically.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Config Ownership
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check config ownership
        env:
          DEPLOY_CONFIG_GLOB: ${{ inputs.deploy-config-glob }}
          ORCHESTRATION_ONLY_PATTERNS: ${{ inputs.orchestration-only-patterns }}
          UI_CONFIG_GLOB: ${{ inputs.ui-config-glob }}
          BASE_REF: ${{ inputs.base-ref }}
        run: |
          python3 -m pip install --quiet pyyaml
          python3 << 'PYEOF'
          import os, re, sys, subprocess, tempfile
          from fnmatch import fnmatch

          try:
              import yaml
          except ImportError:
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", "--quiet", "pyyaml"]
              )
              import yaml

          # -------------------------------------------------------------------
          # Default orchestration-only patterns — env vars / config keys
          # matching these are infrastructure concerns that legitimately
          # belong in deploy-plane config (volume mounts, ports, resource
          # limits, etc.).  Everything else should be owned internally by
          # the component.
          # -------------------------------------------------------------------
          _DEFAULT_ORCHESTRATION_ONLY = [
              # --- port mappings ---
              r".*_PORT$", r"^PORT$",
              # --- volume / mount paths (infrastructure) ---
              r".*_VOLUME$", r".*_MOUNT$", r".*_MOUNT_PATH$",
              r".*_VOLUME_DIR$", r".*_DATA_DIR$",
              # --- resource limits ---
              r".*_MEMORY(_LIMIT)?$", r".*_CPU(_LIMIT)?$",
              r".*_LIMITS?$", r".*_REQUESTS?$",
              # --- container / image ---
              r".*_IMAGE$", r".*_TAG$", r".*_PULL_POLICY$",
              # --- network ---
              r".*_HOST(NAME)?$", r".*_NETWORK$", r".*_DNS$",
              r".*_SUBNET$", r".*_INGRESS$",
              # --- replicas / scale ---
              r".*_REPLICAS$", r".*_SCALE$", r".*_COUNT$",
              # --- health checks ---
              r".*_HEALTHCHECK.*", r".*_LIVENESS.*", r".*_READINESS.*",
              # --- logging *driver* (orchestration-level only) ---
              r".*_LOG_DRIVER$", r".*_LOG_OPTS$",
              # --- secrets *references* (not values) ---
              r".*_SECRET(_ARN|_NAME|_ID)?$", r".*_SECRETS?$",
              # --- node / placement ---
              r".*_NODE$", r".*_PLACEMENT$", r".*_AFFINITY$",
              # --- restart policy ---
              r".*_RESTART_POLICY$", r".*_RESTART$",
              # --- container runtime user/group ---
              r"^PGID$", r"^PUID$", r"^(CONTAINER_)?USER$",
              r"^(CONTAINER_)?GROUP$",
              # --- timezone (infrastructure) ---
              r"^TZ$", r"^TIMEZONE$",
              # --- Docker / Compose built-ins ---
              r"^COMPOSE_.*", r"^DOCKER_.*",
              # --- Kubernetes built-in env vars ---
              r"^KUBERNETES_.*",
              # --- proxy (infrastructure) ---
              r".*_PROXY$", r"^NO_PROXY$", r"^HTTPS?_PROXY$",
              r"^HTTP_PROXY$", r"^HTTPS_PROXY$",
              # --- service discovery ---
              r".*_SERVICE_NAME$", r".*_NAMESPACE$",
              # --- tracing endpoint (infrastructure URL) ---
              r".*_OTLP_ENDPOINT$", r".*_TRACING_ENDPOINT$",
              r".*_METRICS_ENDPOINT$",
              # --- runtime directory (infrastructure) ---
              r".*_RUNTIME_DIR$", r".*_TMP_DIR$",
          ]


          def _load_patterns(patterns_str):
              """Parse newline-separated regex patterns."""
              if not patterns_str or not patterns_str.strip():
                  return [re.compile(p) for p in _DEFAULT_ORCHESTRATION_ONLY]

              compiled = []
              for line in patterns_str.strip().split("\n"):
                  line = line.strip()
                  if line and not line.startswith("#"):
                      compiled.append(re.compile(line))

              if not compiled:
                  return [re.compile(p) for p in _DEFAULT_ORCHESTRATION_ONLY]
              return compiled


          def _is_orchestration_only(name, patterns):
              for pat in patterns:
                  if pat.match(name):
                      return True
              return False


          def _extract_env_vars(yaml_path):
              """Extract environment variable *names* from a deploy-config YAML file.

              Handles common patterns:
                docker-compose:
                  environment: {FOO: bar}        # dict form
                  environment: ["FOO=bar"]        # list form
                Kubernetes:
                  env: [{name: FOO, value: bar}]
                  env: [{name: FOO, valueFrom: ...}]
              Returns a set of uppercase env-var name strings.
              """
              env_vars = set()
              try:
                  with open(yaml_path) as fh:
                      doc = yaml.safe_load(fh)
              except (yaml.YAMLError, OSError):
                  return env_vars

              if not isinstance(doc, dict):
                  return env_vars

              def _walk(obj):
                  if isinstance(obj, dict):
                      for k, v in obj.items():
                          if k in ("environment", "env"):
                              if isinstance(v, dict):
                                  for ek in v:
                                      if isinstance(ek, str):
                                          env_vars.add(ek)
                              elif isinstance(v, list):
                                  for item in v:
                                      if isinstance(item, str) and "=" in item:
                                          env_vars.add(item.split("=", 1)[0])
                                      elif isinstance(item, dict):
                                          name = item.get("name")
                                          if isinstance(name, str):
                                              env_vars.add(name)
                          else:
                              _walk(v)
                  elif isinstance(obj, list):
                      for item in obj:
                          _walk(item)

              _walk(doc)
              return env_vars


          def _get_changed_files(base_ref, glob_str):
              result = subprocess.run(
                  ["git", "diff", "--name-only", base_ref, "HEAD"],
                  capture_output=True, text=True,
              )
              if result.returncode != 0:
                  print(
                      f"::warning::git diff failed: {result.stderr.strip()}",
                      file=sys.stderr,
                  )
                  return []

              files = [f for f in result.stdout.strip().split("\n") if f]
              globs = [g for g in glob_str.split() if g]
              if not globs:
                  return []

              matched = []
              for f in files:
                  for g in globs:
                      if fnmatch(f, g):
                          matched.append(f)
                          break
              return matched


          def _get_old_file_content(base_ref, filepath):
              """Return the file content at base_ref, or None if it didn't exist."""
              result = subprocess.run(
                  ["git", "show", f"{base_ref}:{filepath}"],
                  capture_output=True, text=True,
              )
              if result.returncode != 0:
                  return None
              return result.stdout


          # -------------------------------------------------------------------
          # Main
          # -------------------------------------------------------------------
          deploy_glob = os.environ.get("DEPLOY_CONFIG_GLOB", "")
          ui_glob = os.environ.get("UI_CONFIG_GLOB", "")
          patterns = _load_patterns(os.environ.get("ORCHESTRATION_ONLY_PATTERNS", ""))
          base_ref = os.environ.get("BASE_REF", "").strip()

          # Resolve base ref
          if not base_ref:
              for candidate in ("origin/main", "main"):
                  result = subprocess.run(
                      ["git", "merge-base", "HEAD", candidate],
                      capture_output=True, text=True,
                  )
                  if result.returncode == 0 and result.stdout.strip():
                      base_ref = result.stdout.strip()
                      break

          if not base_ref:
              print(
                  "::notice::Could not determine base ref — "
                  "skipping config ownership check"
              )
              sys.exit(0)

          errors = []

          # ---- deploy-plane config check ----
          if deploy_glob:
              for filepath in _get_changed_files(base_ref, deploy_glob):
                  if not os.path.exists(filepath):
                      # File was deleted — nothing to check
                      continue

                  old_raw = _get_old_file_content(base_ref, filepath)
                  old_env_vars = set()
                  if old_raw is not None:
                      with tempfile.NamedTemporaryFile(
                          mode="w", suffix=".yml", delete=False
                      ) as tf:
                          tf.write(old_raw)
                          tmp_path = tf.name
                      try:
                          old_env_vars = _extract_env_vars(tmp_path)
                      finally:
                          os.unlink(tmp_path)

                  new_env_vars = _extract_env_vars(filepath)
                  added = new_env_vars - old_env_vars

                  for ev in sorted(added):
                      if not _is_orchestration_only(ev, patterns):
                          errors.append(
                              f"{filepath}: new environment variable '{ev}' "
                              f"is not orchestration-only — this setting "
                              f"should be owned by the component internally, "
                              f"not exposed in deploy-plane config.  "
                              f"See robotsix-standards config-standard.md "
                              f"for the config-ownership model."
                          )

          # ---- central-deploy UI check (opt-in) ----
          if ui_glob:
              for filepath in _get_changed_files(base_ref, ui_glob):
                  if not os.path.exists(filepath):
                      continue

                  result = subprocess.run(
                      ["git", "diff", base_ref, "HEAD", "--", filepath],
                      capture_output=True, text=True,
                  )
                  if result.returncode != 0:
                      continue

                  for line in result.stdout.split("\n"):
                      if not line.startswith("+") or line.startswith("+++"):
                          continue
                      # Heuristic: find UPPER_CASE_WITH_UNDERSCORES tokens
                      # in added lines — these are likely config key
                      # references.
                      for token in re.findall(
                          r"\b([A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+)\b", line
                      ):
                          if not _is_orchestration_only(token, patterns):
                              errors.append(
                                  f"{filepath}: added line references "
                                  f"'{token}' which appears to be a "
                                  f"component-internal setting exposed in "
                                  f"central-deploy UI.  Central-deploy UIs "
                                  f"should only handle "
                                  f"uniform-across-all-UIs settings.  "
                                  f"See robotsix-standards config-standard.md."
                              )

          if errors:
              for msg in errors:
                  print(f"::error::{msg}", file=sys.stderr)
              print(
                  f"\n{len(errors)} config-ownership violation(s) found.",
                  file=sys.stderr,
              )
              print(
                  "See robotsix-standards config-standard.md for "
                  "the config-ownership model.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("::notice::No config-ownership violations found.")
          PYEOF
