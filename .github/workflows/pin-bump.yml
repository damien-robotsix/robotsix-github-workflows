name: Pin Bump

# Bumps ``rev`` fields in [tool.uv.sources] git pins to the latest commit on
# each dependency's default branch, then runs ``uv lock`` and opens a PR.
#
# Unlike deps-bump.yml (which uses uv lock --upgrade-package), this workflow
# targets git-sourced dependencies that are pinned by commit SHA rather than
# by version.  It resolves the HEAD commit of each dependency's default branch
# and rewrites the rev field directly.
#
# CRITICAL: This workflow pushes commits and creates/updates PRs, so it MUST
# use a caller-supplied credential that is NOT the default GITHUB_TOKEN.
# GitHub deliberately suppresses workflow runs for events created by
# GITHUB_TOKEN to prevent recursion — CI workflows will NOT fire on the bump
# PR if you pass GITHUB_TOKEN.
#
# The caller MUST supply a GitHub App (app-id input + app-private-key
# secret). An installation token is minted per run; no expiry/rotation,
# bot identity. App tokens live ~1h so they cannot be stored as a
# static secret, which is why minting happens HERE and not in the
# caller (reusable-workflow `secrets:` cannot carry runtime step
# outputs).

on:
  workflow_call:
    inputs:
      packages:
        description: >
          Space-separated list of package names to bump (subset of
          [tool.uv.sources] entries).  When empty (default), ALL
          git-sourced pins are bumped.
        required: false
        type: string
        default: ""
      uv-version:
        description: uv version to install.
        required: false
        type: string
        default: "0.8.15"
      default-branch:
        description: Base branch for the PR and git push target.
        required: false
        type: string
        default: "main"
      bump-branch:
        description: >
          Branch to force-push the bump commit to.  Stable name → repeated
          runs overwrite; an open PR on the branch is detected and reused
          rather than duplicated.
        required: false
        type: string
        default: "pin-bump/first-party"
      app-id:
        description: >
          GitHub App ID used to mint an installation token for the
          bump push (pair with the app-private-key secret). The app
          must be installed on the repo with contents:write and
          pull-requests:write.
        required: true
        type: string
    secrets:
      app-private-key:
        description: >
          PEM private key of the GitHub App named by the app-id
          input. Required when app-id is set.
        required: true

permissions:
  contents: read

jobs:
  bump:
    name: Bump git pins
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push bump branch
      pull-requests: write   # gh pr create
    steps:
      # Mint the caller-supplied bump token, check out the calling repo
      # with it (so the persisted credential carries the push identity),
      # check out the workflow-library repo for scripts/pin-bump.py,
      # install uv, and set the bot git identity. Shared prelude with the
      # other bump/release workflows.
      - name: Bump setup
        id: setup
        uses: ./.github/actions/bump-setup
        with:
          app-id: ${{ inputs.app-id }}
          app-private-key: ${{ secrets.app-private-key }}
          uv-version: ${{ inputs.uv-version }}
          checkout-repository: damien-robotsix/robotsix-github-workflows
          checkout-path: _workflow-lib

      - name: Resolve and update git pin revs
        id: bump
        env:
          FILTER_PACKAGES: ${{ inputs.packages }}
        run: |
          PKG_ARGS=""
          # shellcheck disable=SC2086
          for p in $FILTER_PACKAGES; do
            PKG_ARGS="$PKG_ARGS --packages $p"
          done
          # shellcheck disable=SC2086
          python3 _workflow-lib/scripts/pin-bump.py per-repo $PKG_ARGS

      - name: Detect changes
        id: diff
        run: |
          git diff --quiet pyproject.toml uv.lock && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push bump branch
        if: steps.diff.outputs.changed == 'true'
        env:
          BUMP_BRANCH: ${{ inputs.bump-branch }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
        run: |
          git checkout -B "$BUMP_BRANCH"
          git add pyproject.toml uv.lock
          git commit -m "chore: bump first-party git pin revs"
          git push --force origin "$BUMP_BRANCH"

      - name: Open or reuse PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          BUMP_BRANCH: ${{ inputs.bump-branch }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
        run: |
          EXISTING=$(gh pr list --head "$BUMP_BRANCH" --base "$DEFAULT_BRANCH" --json number -q '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already open for ${BUMP_BRANCH} — updated by the force-push above."
          else
            gh pr create \
              --title "chore: bump first-party git pin revs" \
              --body "Automated first-party git pin bump via \`scripts/pin-bump.py\`." \
              --base "$DEFAULT_BRANCH" \
              --head "$BUMP_BRANCH"
          fi
