name: Self-Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline Check
    uses: ./.github/workflows/baseline-check.yml  # zizmor: ignore[self-repository]

  config-ownership:
    name: Config Ownership Check
    uses: ./.github/workflows/config-ownership-check.yml  # zizmor: ignore[self-repository]

  lint:
    name: Lint Workflows
    uses: ./.github/workflows/lint-workflows.yml  # zizmor: ignore[self-repository]
    with:
      run-actionlint: true
      run-zizmor: true
