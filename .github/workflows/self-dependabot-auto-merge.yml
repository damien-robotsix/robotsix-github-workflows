name: Dependabot auto-merge

# This repo's own caller of the shared reusable workflow below. It lives in a
# separate file on purpose: dependabot-auto-merge.yml is the fleet-shared
# implementation (`on: workflow_call`) that every consumer repo pins by SHA.
# Overwriting it with a caller (2026-08-09, #74) stranded the implementation
# at a frozen historical SHA — any consumer whose pin-bump sweep advanced past
# that commit called a file with no workflow_call trigger and died with a
# workflow parse failure (robotsix-chat, 2026-09-01).
#
# The local `$/` reference always runs the implementation from this same
# commit, so it needs no pin and can never drift.

# pull_request_target, not pull_request: dependabot-triggered pull_request
# runs only receive Dependabot-scoped secrets, so RELEASE_APP_PRIVATE_KEY
# (an Actions secret) would arrive empty and the App token could not be
# minted. The called job never checks out PR head code, so the elevated
# base-repo context is safe here.
on:
  # Safe here: the called job runs no PR head code — it only labels and
  # merges via gh, and its checkout takes the base branch.
  pull_request_target: # zizmor: ignore[dangerous-triggers]

permissions: {}  # no workflow-level default; the job grants its own

jobs:
  auto-merge:
    name: Dependabot auto-merge
    # Dependabot dependency bumps only.
    #
    # release-please PRs are deliberately NOT auto-merged: that PR *is* the
    # release gate. Auto-merging it would cut a release on every push to
    # main, which makes the version number meaningless. Releases stay a
    # human decision.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    # contents: write and pull-requests: write needed to approve and merge PRs
    permissions:
      contents: write  # approve and merge the PR
      pull-requests: write  # label and merge the PR
    uses: $/.github/workflows/dependabot-auto-merge.yml
    # Every dependabot PR in THIS repo touches .github/workflows/**, which
    # GITHUB_TOKEN cannot merge ("refusing to allow a GitHub App to create or
    # update workflow … without `workflows` permission" — #109/#130 sat stuck
    # 2026-08-21 → 2026-09-02). Supply the App so the shared workflow mints a
    # token with workflows: write.
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
