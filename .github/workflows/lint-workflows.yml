name: Lint Workflows

on:
  workflow_call:
    inputs:
      run-actionlint:
        description: Whether to run actionlint on workflow files.
        required: false
        type: boolean
        default: false
      run-zizmor:
        description: Whether to run zizmor security audit on workflow files.
        required: false
        type: boolean
        default: false
      sarif-workflows:
        description: >-
          Space-separated list of reusable workflow filenames (basename only,
          no path) that upload SARIF results and therefore require the
          security-events:write permission on every calling job.
        required: false
        type: string
        default: "codeql.yml scan-container.yml"

jobs:
  check-permissions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Validate SARIF upload permissions
        env:
          SARIF_WORKFLOWS: ${{ inputs.sarif-workflows }}
        run: python3 scripts/lint_sarif_permissions.py

  actionlint:
    if: ${{ inputs.run-actionlint }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@db58217885f9a6570da9c71be4e40ec33fe44a1f  # v1.65.0
        with:
          fail_on_error: true

  zizmor:
    if: ${{ inputs.run-zizmor }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
      - name: Run zizmor
        run: |
          python3 -m pip install --quiet zizmor
          zizmor --persona=pedantic .github/workflows/
