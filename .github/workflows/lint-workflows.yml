name: Lint Workflows

on:
  workflow_call:
    inputs:
      run-actionlint:
        description: Whether to run actionlint on workflow files.
        required: false
        type: boolean
        default: false
      run-zizmor:
        description: Whether to run zizmor security audit on workflow files.
        required: false
        type: boolean
        default: false
      sarif-workflows:
        description: >-
          Space-separated list of reusable workflow filenames (basename only,
          no path) that upload SARIF results and therefore require the
          security-events:write permission on every calling job.
        required: false
        type: string
        default: "codeql.yml scan-container.yml scorecard.yml"
      dockerfiles:
        description: >-
          Space-separated list of Dockerfile paths (relative to the repository
          root) whose FROM instructions must be pinned to an @sha256 digest,
          e.g. "Dockerfile sandbox/Dockerfile". Empty (the default) skips the
          check.
        required: false
        type: string
        default: ""
      run-workflow-rules:
        description: >-
          Whether to run the workflow-conventions checker
          (scripts/check_workflow_rules.py) on the caller's
          .github/workflows and .github/actions.
        required: false
        type: boolean
        default: false
      workflow-rules:
        description: >-
          Comma-separated rules enforced when run-workflow-rules is true:
          sha-pin, persist-credentials, static-defaults, harden-runner-first,
          setup-uv, uv-sync-frozen, or "all".
        required: false
        type: string
        default: "sha-pin,persist-credentials,static-defaults"
      trivyignore:
        description: >-
          Path (relative to the repository root) of a `.trivyignore` whose
          suppressions must carry `# expires: YYYY-MM-DD` annotations, e.g.
          ".trivyignore". The job fails once any entry's expiry date is
          reached. Empty (the default) skips the check.
        required: false
        type: string
        default: ""
      trivyignore-missing-expiry:
        description: >-
          Policy for `.trivyignore` entries without an `# expires:`
          annotation: "warn" (the default) annotates them without failing,
          "fail" fails the job.
        required: false
        type: string
        default: "warn"

permissions:
  contents: read

jobs:
  check-permissions:
    name: Check permissions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      # The lint scripts live in THIS workflows repo, not in the caller's
      # checkout — a bare `scripts/...` path resolves against the CALLER
      # and fails for every consumer. Check the workflow repo out at the
      # exact ref this reusable workflow runs from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: damien-robotsix/robotsix-github-workflows
          ref: ${{ github.job_workflow_sha }}
          path: _workflow-lib
          persist-credentials: false

      - name: Validate SARIF upload permissions
        env:
          SARIF_WORKFLOWS: ${{ inputs.sarif-workflows }}
        run: python3 _workflow-lib/scripts/lint_sarif_permissions.py

      - name: Validate trigger coverage
        run: python3 _workflow-lib/scripts/lint_trigger_coverage.py

  dockerfile-pins:
    name: Dockerfile digest pins
    if: ${{ inputs.dockerfiles != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      # The lint script lives in THIS workflows repo, not the caller's
      # checkout (see check-permissions above).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: damien-robotsix/robotsix-github-workflows
          ref: ${{ github.job_workflow_sha }}
          path: _workflow-lib
          persist-credentials: false

      - name: Check FROM digest pins
        env:
          DOCKERFILES: ${{ inputs.dockerfiles }}
        # Word-splitting of $DOCKERFILES is intentional (space-separated list).
        run: |
          set -f  # no glob expansion of the caller-supplied paths
          # shellcheck disable=SC2086
          python3 _workflow-lib/scripts/lint_dockerfile_pins.py $DOCKERFILES

  workflow-rules:
    name: Workflow rules
    if: ${{ inputs.run-workflow-rules }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      # The checker lives in THIS workflows repo, not the caller's
      # checkout (see check-permissions above).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: damien-robotsix/robotsix-github-workflows
          ref: ${{ github.job_workflow_sha }}
          path: _workflow-lib
          persist-credentials: false

      - name: Check workflow conventions
        env:
          WORKFLOW_RULES: ${{ inputs.workflow-rules }}
        run: python3 _workflow-lib/scripts/check_workflow_rules.py --rules "$WORKFLOW_RULES"

  trivyignore-expiry:
    name: Trivyignore expiry
    if: ${{ inputs.trivyignore != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      # The check script lives in THIS workflows repo, not the caller's
      # checkout (see check-permissions above).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: damien-robotsix/robotsix-github-workflows
          ref: ${{ github.job_workflow_sha }}
          path: _workflow-lib
          persist-credentials: false

      - name: Check .trivyignore suppression expiry
        env:
          TRIVYIGNORE: ${{ inputs.trivyignore }}
          MISSING_EXPIRY: ${{ inputs.trivyignore-missing-expiry }}
        run: |
          python3 _workflow-lib/scripts/check_trivyignore_expiry.py \
            --missing-expiry "$MISSING_EXPIRY" -- "$TRIVYIGNORE"

  actionlint:
    name: Actionlint
    if: ${{ inputs.run-actionlint }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@1758727be30241166609dad4c97588b6ad411f32  # v1.79.1
        with:
          fail_on_error: true
          # actionlint does not know the github.job_workflow_sha context.
          # Suppress only that specific finding rather than the whole
          # expression rule.
          actionlint_flags: -ignore job_workflow_sha

  zizmor:
    name: Zizmor
    if: ${{ inputs.run-zizmor }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Run zizmor
        run: |
          python3 -m pip install --quiet "zizmor>=1.30"
          zizmor --persona=pedantic .github/workflows/
