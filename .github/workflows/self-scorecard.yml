name: Scorecard

# This repo's own OpenSSF Scorecard run.  It is standalone (not a caller of
# the shared scorecard.yml) on purpose: `publish_results: true` — needed for
# the public badge in README.md — makes the Scorecard API verify this exact
# workflow file, and that verification rejects reusable-workflow callers,
# top-level env/defaults, and workflow-level write permissions.

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 5 * * 1"  # Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # SARIF upload to Code Scanning
      id-token: write  # OIDC token to publish results to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
