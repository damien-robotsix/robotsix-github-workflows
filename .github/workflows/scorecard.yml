name: OpenSSF Scorecard

# Reusable OpenSSF Scorecard analysis: assesses repository-level
# supply-chain posture (Token-Permissions, Branch-Protection,
# Dangerous-Workflow, Maintained, Pinned-Dependencies, Signed-Releases, …)
# and uploads the results as SARIF to the caller's Code Scanning tab.
#
# Results are NOT published to the public Scorecard API from here:
# scorecard-action's `publish_results: true` verifies the *calling* workflow
# file and rejects reusable-workflow callers.  Repos that want the public
# badge add a standalone workflow instead (see self-scorecard.yml in this
# repo for the reference shape).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard
