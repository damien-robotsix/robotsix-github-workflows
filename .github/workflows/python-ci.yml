name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to set up.
        required: false
        type: string
        default: "3.14"
      uv-version:
        description: uv version to install.
        required: false
        type: string
        default: "0.12.5"
      install-extras:
        description: Space-separated extras expanded into repeated --extra flags on uv sync --frozen. The dev group arrives automatically via [tool.uv] default-groups.
        required: false
        type: string
        default: "tracing"
      cov-package:
        description: Package passed to pytest --cov=<pkg>.
        required: false
        type: string
        default: "robotsix_mill"
      coverage-threshold:
        description: >
          Value for pytest --cov-fail-under. Must be ≥ 80 (fleet-wide hard
          minimum enforced at runtime). Callers may raise the bar above 80
          but cannot lower it — passing a value below 80 fails the job.
        required: false
        type: string
        default: "80"
      pytest-args:
        description: Extra pytest selectors/markers.
        required: false
        type: string
        default: -m "not docker"
      pytest-numprocesses:
        description: Value passed to pytest-xdist -n (e.g. "auto" or a fixed int like "4" for runners whose advertised cores exceed real vCPUs).
        required: false
        type: string
        default: "auto"
      runs-on:
        description: Runner label for the tests job.
        required: false
        type: string
        default: "ubuntu-latest"
      run-deptry:
        description: Whether to run the deptry dependency-hygiene step.
        required: false
        type: boolean
        default: true
      run-vulture:
        description: >
          When true, a separate vulture job runs `uv run vulture` (vulture
          2.16, provisioned via --with) as a dead-code gate. Default false —
          no extra job until a caller opts in.
        required: false
        type: boolean
        default: false
      vulture-args:
        description: >
          Arguments passed verbatim to vulture when run-vulture is true
          (shell quoting honoured), e.g.
          `src/ vulture_whitelist.py --min-confidence 80`. When empty,
          vulture reads [tool.vulture] from pyproject.toml.
        required: false
        type: string
        default: ""
      run-audit:
        description: Whether to run the dependency CVE audit step (uv audit or pip-audit).
        required: false
        type: boolean
        default: true
      audit-ignore:
        description: >
          DEPRECATED — list the ids in audit-ignore-file instead (emits a
          warning when set). Space- or comma-separated GHSA/CVE ids merged
          with audit-ignore-file and passed as repeated --ignore-until-fixed
          flags to uv audit (--ignore-vuln on the pip-audit fallback).
        required: false
        type: string
        default: ""
      audit-ignore-file:
        description: >
          Repo-relative path of the single-source advisory ignore file
          (one "ID  # reason" per line, optional "# expires: YYYY-MM-DD").
          Shared with python-security.yml and the audit-ignore pre-commit
          hook. A missing file means no advisories are ignored; an expired
          entry fails the audit. Ids map to --ignore-until-fixed on uv audit
          (auto-clears once a fix ships) and --ignore-vuln on pip-audit.
        required: false
        type: string
        default: ".audit-ignore"
      audit-sarif:
        description: >
          When true (and run-audit is true), an extra audit-sarif job runs
          `uv audit --frozen --output-format sarif` (honouring
          audit-ignore-file / audit-ignore) and uploads the result to code
          scanning via github/codeql-action/upload-sarif. The audit stays
          blocking: CVEs fail the job, and the SARIF is still uploaded. The
          CALLING job must grant `security-events: write` (plus
          `contents: read`) when this is on. Default false — no extra job.
        required: false
        type: boolean
        default: false
      check-lock:
        description: >
          When true, run `uv lock --check` so a uv.lock that has drifted from
          pyproject.toml fails CI (`uv sync --frozen` alone does not detect
          drift). Default false.
        required: false
        type: boolean
        default: false
      run-bandit:
        description: Whether to run the bandit security SAST step.
        required: false
        type: boolean
        default: true
      bandit-severity:
        description: Severity floor passed to bandit --severity-level.
        required: false
        type: string
        default: "medium"
      mypy-advisory:
        description: >-
          When true, mypy runs in baseline-ratchet mode against a committed
          mypy-baseline.txt (new errors block, pre-existing ones are tolerated);
          REQUIRES the consumer to ship mypy-baseline.txt or the step crashes.
          When false, plain `mypy --strict` runs as a blocking gate (no baseline
          needed). Default is false so consumers without a baseline get a working
          strict gate; repos that maintain a baseline (e.g. robotsix-mill) opt in
          with true.
        required: false
        type: boolean
        default: false
      job_split:
        description: >-
          When true, emit separate lint, typecheck, and test jobs instead of one
          monolithic tests job. Each reports its own green/red status check and
          runs in parallel, reducing CI wall-clock time from ~sum-of-all to
          ~max-of-three. When false (default), a single tests job runs all steps
          sequentially — backward-compatible with existing callers.
        required: false
        type: boolean
        default: false

# No workflow-level `permissions:` block on purpose. Every job except
# audit-sarif declares its own least-privilege block. audit-sarif declares
# none, so it inherits the CALLER's token. That lets it use
# security-events:write when a caller opts in with audit-sarif: true.
# Declaring `security-events: write` here would break every existing caller
# that does not grant it, with a startup_failure (GitHub checks requested
# permissions against the caller's grant whether or not the job's `if:` is
# true).

jobs:
  tests:
    if: ${{ !inputs.job_split }}
    name: Tests
    runs-on: ${{ inputs.runs-on }}
    permissions:
      # contents:read is REQUIRED for actions/checkout to clone PRIVATE
      # caller repos. Declaring any permissions block resets all unlisted
      # scopes to `none`; without contents:read the checkout of a private
      # consumer fails with "Repository not found" (public callers are
      # unaffected — their clone needs no token).
      contents: read
    steps:
      - uses: damien-robotsix/robotsix-github-workflows/.github/actions/python-setup@3e3e01a6eec8588bfcc756954640fa91e3801ff1
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          install-extras: ${{ inputs.install-extras }}

      - name: Lockfile freshness (uv lock --check)
        if: ${{ inputs.check-lock }}
        # `uv sync --frozen` (run by python-setup) installs straight from
        # uv.lock without comparing it to pyproject.toml, so it neither
        # detects nor repairs drift — this check fails if the lock is stale.
        run: uv lock --check

      - name: Enforce coverage floor (hard minimum 80)
        # The fleet-wide coverage minimum lives here, not in per-repo
        # thresholds. Callers may raise the bar above 80 but cannot lower
        # it — the floor is enforced here so raising it fleet-wide is a
        # single PR to this file.
        # [ -lt ] exits with code 2 (not 1) when the operand is not a
        # valid integer, which also fails the step — acceptable since
        # valid threshold values are always non-negative integers.
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          if [ "${COVERAGE_THRESHOLD}" -lt 80 ]; then
            echo "::error::coverage-threshold=${COVERAGE_THRESHOLD} is below the fleet-wide hard minimum of 80. Either omit the input (default: 80) or set a value ≥ 80."
            exit 1
          fi

      - name: deptry (dependency hygiene)
        if: ${{ inputs.run-deptry }}
        env:
          UV_PROJECT_ENVIRONMENT: system
        # Provision deptry via --with so consumers need not declare it as a
        # dev dependency (mirrors the bandit step). A bare `uv run deptry`
        # fails with "Failed to spawn: deptry" for any repo that doesn't
        # ship deptry itself.
        run: uv run --with deptry==0.25.1 deptry .

      - name: Checkout workflow library (audit-ignore parser)
        if: ${{ inputs.run-audit }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: damien-robotsix/robotsix-github-workflows
          ref: ${{ github.job_workflow_sha }}
          path: _workflow-lib
          persist-credentials: false

      - name: Dependency audit (CVE scan)
        if: ${{ inputs.run-audit }}
        env:
          UV_PROJECT_ENVIRONMENT: system
          AUDIT_IGNORE: ${{ inputs.audit-ignore }}
          AUDIT_IGNORE_FILE: ${{ inputs.audit-ignore-file }}
        # uv audit --frozen reads the committed uv.lock natively.
        # It's a preview subcommand (needs --preview in stable builds)
        # but --help works without --preview since uv ≥ 0.6.12, so we
        # probe availability first.  If unavailable, fall back to
        # pip-audit via uv export --frozen.
        # IMPORTANT: we must NOT ||-fallback on uv audit's exit code
        # because a non-zero exit can also mean "CVEs found" — masking
        # those via a passthrough pip-audit run would be a false-pass.
        # Ignored ids come from the single-source audit-ignore-file
        # (scripts/audit_ignore.py), merged with the deprecated inline
        # audit-ignore input; both the uv audit and pip-audit paths honour
        # them.  The library checkout is removed afterwards so later ruff /
        # mypy / bandit steps never scan it.
        run: |
          trap 'rm -rf _workflow-lib' EXIT
          lib=_workflow-lib/scripts/audit_ignore.py
          if uv audit --help >/dev/null 2>&1; then
            # --ignore-until-fixed automatically un-ignores once a fix
            # ships, matching the fleet policy of blocking on fixable
            # findings only.
            python3 "$lib" --file "$AUDIT_IGNORE_FILE" --extra "$AUDIT_IGNORE" --format uv -- \
              uv audit --frozen --preview
          else
            # --no-hashes avoids pip hash-verification failures on VCS (git)
            # dependencies, which can't carry hashes. Also strip the editable
            # project line (-e .) — pip-audit cannot install editable file://
            # requirements.
            uv export --frozen --no-hashes | grep -v '^-e \.' | \
              python3 "$lib" --file "$AUDIT_IGNORE_FILE" --extra "$AUDIT_IGNORE" --format pip-audit -- \
              uv run --with pip-audit==2.10.1 pip-audit -r /dev/stdin
          fi

      - name: Ruff (lint + format check)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check --diff .

      - name: Mypy (static type check, baseline ratchet)
        if: ${{ inputs.mypy-advisory }}
        # Ratchets against a committed mypy-baseline.txt snapshot: known
        # pre-existing strict-mode errors (~1,100 across ~140 files) are
        # tolerated, but any *new* error not in the baseline blocks CI.
        # To shrink the baseline after fixing errors, run:
        #   uv run mypy src/ --strict | uv run mypy-baseline sync
        # and commit the updated mypy-baseline.txt.
        env:
          UV_PROJECT_ENVIRONMENT: system
        # mypy-baseline provisioned via --with (consumers need not declare it).
        run: uv run mypy src/ --strict | uv run --with mypy-baseline==0.7.4 mypy-baseline filter

      - name: Mypy (baseline burndown nudge)
        if: ${{ inputs.mypy-advisory }}
        # Surfaces one pre-existing error from the baseline as a CI
        # annotation to encourage incremental burndown. Non-blocking.
        env:
          UV_PROJECT_ENVIRONMENT: system
        # CI checks out in detached HEAD with only the remote-tracking
        # ref available, so point suggest's git-diff at origin/main
        # (the default "main" is not a local branch here).
        #
        # `mypy-baseline suggest` raises RuntimeError('baseline is empty') on a
        # repo with nothing left to burn down, and that fires before
        # --exit-zero can apply — so a fully mypy-clean repo could not adopt
        # this workflow at all. There is nothing to nudge in that case: skip.
        run: |
          if [ ! -s mypy-baseline.txt ]; then
            echo "mypy-baseline.txt is empty — nothing to burn down, skipping."
            exit 0
          fi
          uv run --with mypy-baseline==0.7.4 mypy-baseline suggest --exit-zero --default-branch origin/main

      - name: Mypy (static type check)
        if: ${{ !inputs.mypy-advisory }}
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run mypy src/ --strict

      - name: Bandit (security SAST)
        if: ${{ inputs.run-bandit }}
        # Severity floor (MEDIUM+) is a deliberate, documented policy —
        # see [tool.bandit] in pyproject.toml / CONTRIBUTING.md.
        env:
          UV_PROJECT_ENVIRONMENT: system
          BANDIT_SEVERITY: ${{ inputs.bandit-severity }}
        run: uv run --with 'bandit[toml]==1.9.4' bandit -c pyproject.toml -r src/ --severity-level "$BANDIT_SEVERITY"

      - name: Checkout workflow library (overlay pinning)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: damien-robotsix/robotsix-github-workflows
          ref: ${{ github.job_workflow_sha }}
          path: _workflow-lib
          persist-credentials: false

      - name: Run tests
        env:
          UV_PROJECT_ENVIRONMENT: system
          GIT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          PYTEST_EXTRA_ARGS: ${{ inputs.pytest-args }}
          PYTEST_NUMPROCESSES: ${{ inputs.pytest-numprocesses }}
          COV_PACKAGE: ${{ inputs.cov-package }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
          INSTALL_EXTRAS: ${{ inputs.install-extras }}
        # Docker integration tests (pytest.mark.docker) require the
        # sandbox Docker image and the mill-sandbox-net proxy network
        # — infrastructure that only exists in the full mill deployment,
        # not in GitHub Actions CI. Skip them here.
        # PYTEST_EXTRA_ARGS carries shell-quoted pytest flags (e.g.
        # ``-m "not docker"``); ``eval set --`` re-parses the quoting so
        # the marker expression arrives as ONE argument (plain unquoted
        # expansion would word-split it into literal-quote fragments and
        # pytest would collect 0 tests).
        run: |
          eval "set -- $PYTEST_EXTRA_ARGS"
          # pytest-xdist provisioned via --with so the default `-n auto`
          # parallelism works for EVERY consumer without each having to
          # declare pytest-xdist (mirrors the deptry/mypy-baseline steps).
          # Without this, a bare `uv run pytest -n auto` fails for any repo
          # that does not itself ship pytest-xdist.
          # pytest-cov is provisioned via --with (mirrors pytest-xdist) so the
          # --cov flags below work for EVERY consumer without each having to
          # declare pytest-cov in its dev group. Without this, a minimal
          # consumer (e.g. a freshly-scaffolded member repo) fails with
          # "pytest: error: unrecognized arguments: --cov" because the plugin
          # is not installed.
          # RULE: the --with overlay must never move a locked package.
          # `uv run --with` resolves overlays WITHOUT uv.lock as a
          # constraint, so a bare `--with pytest-xdist` pulled pytest 9.2.0
          # over a lock pinning 9.1.1 (2026-10-28 incident).
          # scripts/uv_with_pins.py reads the exported lock and pins pytest,
          # pytest-asyncio, pluggy and coverage to their locked versions, and
          # pytest-xdist / pytest-cov to the locked version (no-op overlay)
          # or a fixed fallback. A plugin missing from the lock warns until
          # the script's FLIP_DATE, then fails — lock both in the dev group.
          # The export mirrors python-setup's `uv sync --frozen --extra …` so
          # tools locked in an optional extra are pinned too; pipefail makes
          # a failing `uv export` abort the step instead of feeding the
          # script empty input (which would yield an unpinned overlay).
          set -o pipefail
          trap 'rm -rf _workflow-lib' EXIT
          extras=()
          for x in $INSTALL_EXTRAS; do
            extras+=(--extra "$x")
          done
          overlay=$(uv export --frozen --no-hashes --no-emit-project "${extras[@]}" | python3 _workflow-lib/scripts/uv_with_pins.py)
          rm -rf _workflow-lib
          mapfile -t overlay_args <<< "$overlay"
          uv run "${overlay_args[@]}" pytest tests/ -n "$PYTEST_NUMPROCESSES" --dist loadscope -x "$@" --tb=long --cov="$COV_PACKAGE" --cov-fail-under="$COVERAGE_THRESHOLD" --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Combine coverage data
        env:
          UV_PROJECT_ENVIRONMENT: system
        # coverage combine merges per-worker .coverage.<host>.<pid>.<rand>
        # files produced by pytest-cov with parallel=true into a single
        # .coverage database.  In non-parallel mode there is nothing to
        # combine and coverage exits 1 — || true makes this a no-op.
        run: uv run --with coverage==7.17.0 coverage combine || true

      - name: Assert coverage database exists
        # coverage.xml is a *report*, not a data file — every downstream
        # consumer (coverage-comment-action, coverage html) needs the
        # .coverage *database*.  Fail fast here instead of letting the
        # upload-artifact step silently ship only coverage.xml.
        run: test -f .coverage

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-data
          path: |
            coverage.xml
            .coverage
          if-no-files-found: error

  audit-sarif:  # zizmor: ignore[excessive-permissions] -- inherits the caller's token by design (see below)
    # Opt-in (audit-sarif: true): publishes the uv audit findings to code
    # scanning. The blocking CVE gate in tests/lint stays in place. This job
    # is blocking as well (no continue-on-error, no `|| true`). The upload
    # step uses `success() || failure()` so the SARIF is still published
    # when the audit finds CVEs.
    # No `permissions:` block: the job inherits the caller's token, and the
    # caller must grant security-events:write + contents:read (see the
    # workflow-level comment above).
    if: ${{ inputs.run-audit && inputs.audit-sarif }}
    name: Dependency audit (SARIF)
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: damien-robotsix/robotsix-github-workflows/.github/actions/python-setup@3e3e01a6eec8588bfcc756954640fa91e3801ff1
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          install-extras: ${{ inputs.install-extras }}

      - name: Checkout workflow library (audit-ignore parser)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: damien-robotsix/robotsix-github-workflows
          ref: ${{ github.job_workflow_sha }}
          path: _workflow-lib
          persist-credentials: false

      - name: Dependency audit (SARIF)
        env:
          UV_PROJECT_ENVIRONMENT: system
          AUDIT_IGNORE: ${{ inputs.audit-ignore }}
          AUDIT_IGNORE_FILE: ${{ inputs.audit-ignore-file }}
        # Same ignore handling as the gated audit step (audit_ignore.py adds
        # --ignore-until-fixed flags and execs uv audit). The SARIF document
        # goes to stdout and is redirected to a file. The exit code is
        # preserved, so CVEs fail the step.
        # pip-audit cannot produce SARIF, so a uv without `audit` is a hard
        # error here rather than a silent fallback. An empty SARIF file (e.g.
        # audit_ignore.py rejected an expired entry before uv ran) is
        # deleted so the upload step is skipped and does not fail with an
        # unrelated parse error.
        run: |
          trap 'rm -rf _workflow-lib; [ -s uv-audit.sarif ] || rm -f uv-audit.sarif' EXIT
          if ! uv audit --help >/dev/null 2>&1; then
            echo "::error::audit-sarif requires a uv version that ships 'uv audit' (set uv-version accordingly)."
            exit 1
          fi
          python3 _workflow-lib/scripts/audit_ignore.py \
            --file "$AUDIT_IGNORE_FILE" --extra "$AUDIT_IGNORE" --format uv -- \
            uv audit --frozen --preview --output-format sarif > uv-audit.sarif

      - name: Upload audit SARIF to code scanning
        if: ${{ (success() || failure()) && hashFiles('uv-audit.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: uv-audit.sarif
          category: uv-audit

  lint:
    if: ${{ inputs.job_split }}
    name: Lint
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: damien-robotsix/robotsix-github-workflows/.github/actions/python-setup@3e3e01a6eec8588bfcc756954640fa91e3801ff1
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          install-extras: ${{ inputs.install-extras }}

      - name: Lockfile freshness (uv lock --check)
        if: ${{ inputs.check-lock }}
        run: uv lock --check

      - name: deptry (dependency hygiene)
        if: ${{ inputs.run-deptry }}
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run --with deptry==0.25.1 deptry .

      - name: Checkout workflow library (audit-ignore parser)
        if: ${{ inputs.run-audit }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: damien-robotsix/robotsix-github-workflows
          ref: ${{ github.job_workflow_sha }}
          path: _workflow-lib
          persist-credentials: false

      - name: Dependency audit (CVE scan)
        if: ${{ inputs.run-audit }}
        env:
          UV_PROJECT_ENVIRONMENT: system
          AUDIT_IGNORE: ${{ inputs.audit-ignore }}
          AUDIT_IGNORE_FILE: ${{ inputs.audit-ignore-file }}
        run: |
          trap 'rm -rf _workflow-lib' EXIT
          lib=_workflow-lib/scripts/audit_ignore.py
          if uv audit --help >/dev/null 2>&1; then
            python3 "$lib" --file "$AUDIT_IGNORE_FILE" --extra "$AUDIT_IGNORE" --format uv -- \
              uv audit --frozen --preview
          else
            uv export --frozen --no-hashes | grep -v '^-e \.' | \
              python3 "$lib" --file "$AUDIT_IGNORE_FILE" --extra "$AUDIT_IGNORE" --format pip-audit -- \
              uv run --with pip-audit==2.10.1 pip-audit -r /dev/stdin
          fi

      - name: Ruff (lint + format check)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check --diff .

  typecheck:
    if: ${{ inputs.job_split }}
    name: Type Check
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: damien-robotsix/robotsix-github-workflows/.github/actions/python-setup@3e3e01a6eec8588bfcc756954640fa91e3801ff1
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          install-extras: ${{ inputs.install-extras }}

      - name: Mypy (static type check, baseline ratchet)
        if: ${{ inputs.mypy-advisory }}
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run mypy src/ --strict | uv run --with mypy-baseline==0.7.4 mypy-baseline filter

      - name: Mypy (baseline burndown nudge)
        if: ${{ inputs.mypy-advisory }}
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run --with mypy-baseline==0.7.4 mypy-baseline suggest --exit-zero --default-branch origin/main

      - name: Mypy (static type check)
        if: ${{ !inputs.mypy-advisory }}
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run mypy src/ --strict

      - name: Bandit (security SAST)
        if: ${{ inputs.run-bandit }}
        env:
          UV_PROJECT_ENVIRONMENT: system
          BANDIT_SEVERITY: ${{ inputs.bandit-severity }}
        run: uv run --with 'bandit[toml]==1.9.4' bandit -c pyproject.toml -r src/ --severity-level "$BANDIT_SEVERITY"

  test:
    if: ${{ inputs.job_split }}
    name: Test
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: damien-robotsix/robotsix-github-workflows/.github/actions/python-setup@3e3e01a6eec8588bfcc756954640fa91e3801ff1
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          install-extras: ${{ inputs.install-extras }}

      - name: Enforce coverage floor (hard minimum 80)
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          if [ "${COVERAGE_THRESHOLD}" -lt 80 ]; then
            echo "::error::coverage-threshold=${COVERAGE_THRESHOLD} is below the fleet-wide hard minimum of 80. Either omit the input (default: 80) or set a value ≥ 80."
            exit 1
          fi

      - name: Checkout workflow library (overlay pinning)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: damien-robotsix/robotsix-github-workflows
          ref: ${{ github.job_workflow_sha }}
          path: _workflow-lib
          persist-credentials: false

      - name: Run tests
        env:
          UV_PROJECT_ENVIRONMENT: system
          GIT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          PYTEST_EXTRA_ARGS: ${{ inputs.pytest-args }}
          PYTEST_NUMPROCESSES: ${{ inputs.pytest-numprocesses }}
          COV_PACKAGE: ${{ inputs.cov-package }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
          INSTALL_EXTRAS: ${{ inputs.install-extras }}
        run: |
          eval "set -- $PYTEST_EXTRA_ARGS"
          # Overlay pinned to the lock — see the tests job's Run tests step.
          set -o pipefail
          trap 'rm -rf _workflow-lib' EXIT
          extras=()
          for x in $INSTALL_EXTRAS; do
            extras+=(--extra "$x")
          done
          overlay=$(uv export --frozen --no-hashes --no-emit-project "${extras[@]}" | python3 _workflow-lib/scripts/uv_with_pins.py)
          rm -rf _workflow-lib
          mapfile -t overlay_args <<< "$overlay"
          uv run "${overlay_args[@]}" pytest tests/ -n "$PYTEST_NUMPROCESSES" --dist loadscope -x "$@" --tb=long --cov="$COV_PACKAGE" --cov-fail-under="$COVERAGE_THRESHOLD" --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Combine coverage data
        env:
          UV_PROJECT_ENVIRONMENT: system
        # coverage combine merges per-worker .coverage.<host>.<pid>.<rand>
        # files produced by pytest-cov with parallel=true into a single
        # .coverage database.  In non-parallel mode there is nothing to
        # combine and coverage exits 1 — || true makes this a no-op.
        run: uv run --with coverage==7.17.0 coverage combine || true

      - name: Assert coverage database exists
        # coverage.xml is a *report*, not a data file — every downstream
        # consumer (coverage-comment-action, coverage html) needs the
        # .coverage *database*.  Fail fast here instead of letting the
        # upload-artifact step silently ship only coverage.xml.
        run: test -f .coverage

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-data
          path: |
            coverage.xml
            .coverage
          if-no-files-found: error

  vulture:
    if: ${{ inputs.run-vulture }}
    name: Vulture (dead code)
    runs-on: ${{ inputs.runs-on }}
    permissions:
      # Least privilege: vulture only reads the checked-out tree.
      # contents:read is still required for actions/checkout (inside
      # python-setup) to clone PRIVATE caller repos.
      contents: read
    steps:
      - uses: damien-robotsix/robotsix-github-workflows/.github/actions/python-setup@3e3e01a6eec8588bfcc756954640fa91e3801ff1
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          install-extras: ${{ inputs.install-extras }}

      - name: Vulture (dead-code detection)
        env:
          UV_PROJECT_ENVIRONMENT: system
          VULTURE_ARGS: ${{ inputs.vulture-args }}
        # vulture is provisioned via --with and pinned to the version the
        # fleet's hand-rolled vulture steps use today (2.16), so consumers
        # need not declare it. Empty VULTURE_ARGS -> vulture reads
        # [tool.vulture] from pyproject.toml. Otherwise the args are passed
        # verbatim; ``eval set --`` re-parses shell quoting (mirrors
        # pytest-args) so e.g. --ignore-decorators "@a,@b" stays ONE arg.
        run: |
          eval "set -- $VULTURE_ARGS"
          uv run --with 'vulture==2.16' vulture "$@"
