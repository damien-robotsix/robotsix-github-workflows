name: Pin Bump Sweep

# Coherent-set fleet-wide pin-bump sweep.
#
# Enumerates every non-archived, non-fork repository owned by the configured
# org, collects all [tool.uv.sources] git-sourced pins across the fleet,
# resolves the HEAD commit of each unique git URL ONCE, and then opens a PR
# in every affected repository so that all repos that share a dependency
# receive the same SHA update in the same sweep.
#
# `workflow_call` only, deliberately. The sweep needs a fleet-wide GitHub App
# token, and this repository holds no credentials of its own — every consuming
# repo owns the `RELEASE_APP_ID` variable and `RELEASE_APP_PRIVATE_KEY` secret
# and passes them in, exactly as it does for release-please. A `schedule` or
# `workflow_dispatch` trigger here would fire with no credentials to mint a
# token with, so the schedule lives in a caller stub instead (see
# robotsix-central-deploy's `pin-bump-sweep.yml`).

on:
  workflow_call:
    inputs:
      owner:
        description: GitHub org/owner whose repos are swept.
        required: false
        type: string
        default: "damien-robotsix"
      uv-version:
        description: uv version to install.
        required: false
        type: string
        default: "0.8.15"
      app-id:
        description: >
          GitHub App ID used to mint an installation token for the
          sweep (pair with the app-private-key secret). The app
          must be installed on every fleet repository with
          contents:write and pull-requests:write.
        required: true
        type: string
    secrets:
      app-private-key:
        description: >
          PEM private key of the GitHub App named by the app-id
          input.
        required: true

permissions:
  contents: read

concurrency:
  group: pin-bump-sweep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    name: Coherent-set sweep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Mint GitHub App installation token
        # An installation-wide token is inherent to this workflow: the sweep
        # discovers the fleet at run time and opens a PR in every repo whose
        # pins moved, so there is no fixed `repositories:` list to scope to.
        # Scope is limited the other way instead — contents:write and
        # pull-requests:write only, and the token is revoked at job cleanup.
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          # `owner` with no `repositories` is what makes the token
          # installation-wide. Omitting `repositories` alone is NOT enough:
          # the action then scopes the token to the calling repository and
          # every cross-repo push 403s ("Permission to <repo> denied to
          # <app>[bot]").
          owner: ${{ inputs.owner || github.repository_owner }}  # zizmor: ignore[github-app]
          permission-contents: write
          permission-pull-requests: write

      # Check out THIS repository, not the caller's: `scripts/pin-bump.py`
      # lives here, and a bare checkout in a reusable workflow lands the
      # caller's repo in the workspace. `job_workflow_sha` is the commit of
      # the reusable workflow file itself, so the script always matches the
      # workflow version being run.
      - name: Check out the workflow repository without credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: damien-robotsix/robotsix-github-workflows
          ref: ${{ github.job_workflow_sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: ${{ inputs.uv-version || '0.8.15' }}

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run coherent-set sweep
        env:
          SWEEP_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ inputs.owner || 'damien-robotsix' }}
        run: |
          python3 scripts/pin-bump.py sweep \
            --owner "$OWNER" \
            --token-env SWEEP_TOKEN
