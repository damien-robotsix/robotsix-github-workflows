name: Dependency Bot Auto-Merge

# Auto-merges dependency-update PRs from Dependabot *or* Renovate. Filename kept
# as dependabot-auto-merge.yml so existing callers don't break.

on:
  workflow_call:
    inputs:
      app-id:
        description: >
          Optional GitHub App ID. When set (paired with the app-private-key
          secret), the merge runs on a minted App installation token with
          `workflows: write` — required to merge a PR that touches
          `.github/workflows/**` (GITHUB_TOKEN is refused with "refusing to
          allow a GitHub App to create or update workflow … without
          `workflows` permission"; observed on this repo's own dependabot
          PRs #109/#130, stuck 2026-08-21 → 2026-09-02). Leave unset to keep
          the plain GITHUB_TOKEN behavior for PRs that never touch workflow
          files.
        required: false
        type: string
        default: ""
    secrets:
      app-private-key:
        description: PEM private key of the GitHub App named by the app-id input.
        required: false

permissions:
  contents: read

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    # pull_request_target is accepted because dependabot-triggered
    # pull_request runs only receive Dependabot-scoped secrets — a caller
    # that passes app-private-key (an Actions secret) must trigger on
    # pull_request_target or the secret arrives empty. This job never
    # checks out PR head code, so the elevated context is safe.
    if: (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'renovate[bot]' || github.event.pull_request.user.login == 'robotsix-mill[bot]')
    timeout-minutes: 30
    permissions:
      contents: write        # auto-merge via gh pr merge
      pull-requests: write   # label PR + gh pr merge

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      # Minted only when the caller supplies App credentials; the merge and
      # label steps fall back to GITHUB_TOKEN otherwise.
      - name: Mint a GitHub App installation token
        id: app-token
        if: inputs.app-id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write  # merge PRs that touch .github/workflows/**

      # Dependabot exposes structured metadata; Renovate does not. The step is
      # skipped for Renovate PRs and the merge proceeds without update-type.
      - name: Fetch dependabot metadata
        id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a  # v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Labelling is cosmetic; merging is the point. In a repo that has never
      # defined the label, `gh pr edit --add-label` exits 1 ("'Skip-Changelog'
      # not found") and used to fail the job *before* the merge step ran — so
      # every dependency PR in that repo sat open forever (63 had piled up
      # fleet-wide by 2026-08-09). Never let labelling block the merge.
      #
      # Self-healing via `gh label create` is deliberately NOT done here: it
      # needs `issues: write`, and a permission added to a reusable workflow
      # must be granted by every caller or the call dies with startup_failure
      # and no logs. Create the label repo-side instead.
      - name: Label PR as Skip-Changelog
        continue-on-error: true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "$PR_URL" --add-label "Skip-Changelog" \
            || echo "::warning::could not apply the Skip-Changelog label — continuing to merge"

      - name: Auto-merge dependency PR
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          echo "Bot: $GITHUB_ACTOR${UPDATE_TYPE:+ | update-type: $UPDATE_TYPE}"

          set +e
          output=$(gh pr merge --auto --squash --delete-branch "$PR_URL" 2>&1)
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "Auto-merge queued (protected repo — will merge when checks pass)"
          # Two ways `--auto` is unavailable and we must merge ourselves:
          #  - no branch protection, so there is nothing to queue behind;
          #  - the repo has "Allow auto-merge" off. GitHub refuses to enable it
          #    on PRIVATE repos on this plan, so PATCHing allow_auto_merge=true
          #    silently stays false there (robotsix-invest, robotsix-website,
          #    hexarchy). Both cases still poll checks before merging, so this
          #    never merges a red PR.
          elif echo "$output" | grep -qiE "protected branch rules not configured|not allowed for this repository|auto[- ]merge is not allowed|enablePullRequestAutoMerge"; then
            echo "Auto-merge unavailable here — polling checks then merging directly"
            gh pr checks "$PR_URL" --watch --fail-fast
            gh pr merge --squash --delete-branch "$PR_URL"
          else
            printf '%s\n' "$output" >&2
            exit "$rc"
          fi
