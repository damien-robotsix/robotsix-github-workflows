name: Secret Scan

# Language-agnostic TruffleHog secret scan.  Unlike python-security.yml it
# needs no setup-uv / uv.lock, so npm, Dart and other non-uv repos can meet
# the fleet secret-scanning control.  The TruffleHog steps below MUST stay
# identical (pins, conditions, flags) to the ones in python-security.yml —
# tests/test-secret-scan-workflow.py enforces it.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the secret-scan job.
        required: false
        type: string
        default: "ubuntu-latest"
      trufflehog-pr-diff:
        description: When true, scan only the PR diff (base/head SHAs); when false, scan the full checkout.
        required: false
        type: boolean
        default: false
      trufflehog-extra-args:
        description: Extra args forwarded to the TruffleHog action's extra_args input.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          # PR-diff TruffleHog needs full history to resolve base..head.
          fetch-depth: 0
          # The scan only reads the checked-out tree; no git push.
          persist-credentials: false

      - name: TruffleHog (PR diff scan)
        if: ${{ inputs.trufflehog-pr-diff && github.event_name == 'pull_request' }}
        # Pin: human follow-up — confirm/refresh this SHA against the
        # intended trufflesecurity/trufflehog release (resolved offline).
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2  # v3.99.7
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: ${{ inputs.trufflehog-extra-args }}

      - name: TruffleHog (full scan)
        if: ${{ !inputs.trufflehog-pr-diff }}
        # Pin: human follow-up — confirm/refresh this SHA against the
        # intended trufflesecurity/trufflehog release (resolved offline).
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2  # v3.99.7
        with:
          path: ./
          extra_args: ${{ inputs.trufflehog-extra-args }}
