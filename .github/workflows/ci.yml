name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint workflows
    uses: ./.github/workflows/lint-workflows.yml  # zizmor: ignore[self-repository]
    with:
      run-actionlint: true
      run-zizmor: true

  test-config-ownership:
    name: Test config-ownership check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - name: Run config-ownership integration test
        run: bash tests/test-config-ownership-check.sh

  test-apply-branch-protection:
    name: Test apply-branch-protection script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - name: Run apply-branch-protection integration test
        run: bash tests/test-apply-branch-protection.sh

  test-baseline-check:
    name: Test baseline-check workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - name: Run baseline-check integration test
        run: bash tests/test-baseline-check.sh

  action-validator:
    name: Validate workflow YAML schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - name: Validate workflows
        uses: mpalmer/action-validator@c994f427b7c42cd5ecb1bc9315cb91c3d7d72e3d  # v0.9.0
        with:
          patterns: |
            .github/workflows/*.yml

  validate-local-action-refs:
    name: Validate local composite action references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
          # Full history so check_local_action_refs.py can resolve every
          # own-repo action @<sha> pin locally (`git cat-file -e
          # <sha>:.github/actions/<name>/action.yml`) without a per-sha
          # network fetch. A shallow checkout would leave those objects
          # absent and force the script's fetch fallback.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Validate local action references
        run: python3 scripts/check_local_action_refs.py --check-orphans
      - name: Enforce AGENT.md workflow rules (SHA pins, static defaults, persist-credentials)
        run: python3 scripts/check_workflow_rules.py

  python-lint:
    name: Lint and type-check Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install lint dependencies
        # Keep these versions in sync with the ruff-pre-commit / mirrors-mypy
        # revs and additional_dependencies in .pre-commit-config.yaml.
        run: |
          python3 -m pip install --quiet ruff==0.17.3 mypy==2.4.0 types-PyYAML==6.0.12.20260906
      - name: Run ruff
        # Rule set lives in pyproject.toml ([tool.ruff]).
        run: python3 -m ruff check scripts
      - name: Run mypy
        # Target files and strictness live in pyproject.toml ([tool.mypy]).
        run: python3 -m mypy

  pytest:
    name: Run Python unit test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: |
          python3 -m pip install --quiet pytest pyyaml
      - name: Run pytest suite
        # pytest discovery is configured in pyproject.toml
        # ([tool.pytest.ini_options]: python_files = test-*.py,
        # --import-mode=importlib), so a bare invocation finds every
        # tests/test-*.py suite automatically — no manual file list to
        # keep in sync with the Makefile.
        run: |
          python3 -m pytest -v
