name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint workflows
    uses: $/.github/workflows/lint-workflows.yml
    with:
      run-actionlint: true
      run-zizmor: true

  test-config-ownership:
    name: Test config-ownership check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - name: Run config-ownership integration test
        run: bash tests/test-config-ownership-check.sh

  action-validator:
    name: Validate workflow YAML schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - name: Validate workflows
        uses: mpalmer/action-validator@c994f427b7c42cd5ecb1bc9315cb91c3d7d72e3d  # v0.9.0
        with:
          patterns: |
            .github/workflows/*.yml

  validate-local-action-refs:
    name: Validate local composite action references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate local action references
        run: python3 scripts/check_local_action_refs.py --check-orphans
