name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-workflows:
    name: Lint workflows
    uses: ./.github/workflows/lint-workflows.yml
    with:
      run-actionlint: true
      run-zizmor: true

  test-config-ownership:
    name: Test config-ownership check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Run config-ownership integration test
        run: bash tests/test-config-ownership-check.sh

  action-validator:
    name: Validate workflow YAML schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Validate workflows
        uses: mpalmer/action-validator@c994f427b7c42cd5ecb1bc9315cb91c3d7d72e3d  # v0.9.0
        with:
          workflow_files: |
            .github/workflows/*.yml
