name: Bump

# Shared reusable workflow for automated dependency-pin bumps.  Supports
# two modes selected via ``bump-mode``:
#
#   deps  —  uv lock --upgrade-package <packages>  (single-repo, first-party)
#   pins  —  scripts/pin-bump.py per-repo <packages>  (single-repo, git-sourced)
#
# CRITICAL: This workflow pushes commits and creates PRs, so it MUST use a
# caller-supplied credential that is NOT the default GITHUB_TOKEN.
# GitHub deliberately suppresses workflow runs for events created by
# GITHUB_TOKEN to prevent recursion — CI workflows will NOT fire on the
# bump PR if you pass GITHUB_TOKEN.
#
# The caller MUST supply a GitHub App (app-id input + app-private-key
# secret). An installation token is minted per run; no expiry/rotation,
# bot identity. App tokens live ~1h so they cannot be stored as a
# static secret, which is why minting happens HERE and not in the
# caller (reusable-workflow `secrets:` cannot carry runtime step
# outputs).

on:
  workflow_call:
    inputs:
      bump-mode:
        description: >
          Bump mode to run. "deps" upgrades first-party package pins via
          uv lock --upgrade-package; "pins" resolves HEAD commits of
          git-sourced dependencies and rewrites rev fields in
          pyproject.toml.
        required: true
        type: string
      packages:
        description: >
          Space-separated list of package names to bump.  For bump-mode
          "deps": first-party packages, each becomes a separate
          --upgrade-package flag.  For bump-mode "pins": subset of
          [tool.uv.sources] entries; when empty ALL git-sourced pins
          are bumped.
        required: true
        type: string
      uv-version:
        description: uv version to install.
        required: false
        type: string
        default: "0.8.15"
      default-branch:
        description: Base branch for the PR and git push target.
        required: false
        type: string
        default: "main"
      bump-branch:
        description: >
          Branch to force-push the bump commit to.  Stable name → repeated
          runs overwrite; an open PR on the branch is detected and reused
          rather than duplicated.
        required: false
        type: string
        default: "deps-bump/first-party"
      app-id:
        description: >
          GitHub App ID used to mint an installation token for the
          bump push (pair with the app-private-key secret). The app
          must be installed on the repo with contents:write and
          pull-requests:write.
        required: true
        type: string
      permission-contents:
        description: >
          Permission scope for the minted token's repository contents
          (push bump branch).
        required: false
        type: string
        default: "write"
      permission-pull-requests:
        description: >
          Permission scope for the minted token's pull requests
          (create/update PRs).
        required: false
        type: string
        default: "write"
    secrets:
      app-private-key:
        description: >
          PEM private key of the GitHub App named by the app-id
          input. Required when app-id is set.
        required: true

permissions:
  contents: read

jobs:
  bump:
    name: Bump
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push bump branch
      pull-requests: write  # gh pr create
    steps:
      # Inlined bump setup — GitHub resolves relative `./` composite-action
      # paths against the caller's checkout, so cross-repo callers fail with
      # "Can't find 'action.yml'". All steps are inlined below.

      - name: Check out workflow library (pins mode)
        if: inputs.bump-mode == 'pins'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: damien-robotsix/robotsix-github-workflows
          path: _workflow-lib
          persist-credentials: false

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          repositories: ${{ github.repository }}
          permission-contents: ${{ inputs.permission-contents }}
          permission-pull-requests: ${{ inputs.permission-pull-requests }}

      - name: Check out repository
        # persist-credentials intentionally left true: the push step needs the
        # minted credential in git's credential store.
        # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: ${{ inputs.uv-version }}

      - name: Set bump-mode parameters
        id: params
        env:
          BUMP_MODE: ${{ inputs.bump-mode }}
        run: |
          case "$BUMP_MODE" in
            deps)
              echo "diff-files=uv.lock" >> "$GITHUB_OUTPUT"
              echo "add-files=uv.lock" >> "$GITHUB_OUTPUT"
              echo "commit-message=chore: bump first-party pins" >> "$GITHUB_OUTPUT"
              echo "pr-title=chore: bump first-party pins" >> "$GITHUB_OUTPUT"
              echo "pr-body=Automated first-party pin bump via \`uv lock --upgrade-package\`." >> "$GITHUB_OUTPUT"
              ;;
            pins)
              echo "diff-files=pyproject.toml uv.lock" >> "$GITHUB_OUTPUT"
              echo "add-files=pyproject.toml uv.lock" >> "$GITHUB_OUTPUT"
              echo "commit-message=chore: bump first-party git pin revs" >> "$GITHUB_OUTPUT"
              echo "pr-title=chore: bump first-party git pin revs" >> "$GITHUB_OUTPUT"
              echo "pr-body=Automated first-party git pin bump via \`scripts/pin-bump.py\`." >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ERROR: unknown bump-mode: $BUMP_MODE" >&2
              exit 1
              ;;
          esac

      - name: Upgrade first-party pins
        if: inputs.bump-mode == 'deps'
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          flags=""
          # shellcheck disable=SC2086
          for pkg in $PACKAGES; do
            flags="$flags --upgrade-package $pkg"
          done
          # shellcheck disable=SC2086
          uv lock $flags

      - name: Resolve and update git pin revs
        if: inputs.bump-mode == 'pins'
        id: bump
        env:
          FILTER_PACKAGES: ${{ inputs.packages }}
        run: |
          PKG_ARGS=""
          # shellcheck disable=SC2086
          for p in $FILTER_PACKAGES; do
            PKG_ARGS="$PKG_ARGS --packages $p"
          done
          # shellcheck disable=SC2086
          python3 _workflow-lib/scripts/pin-bump.py per-repo $PKG_ARGS

      # Inlined commit + PR — same rationale as bump setup above.

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit bump and open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUMP_BRANCH: ${{ inputs.bump-branch }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          ADD_FILES: ${{ steps.params.outputs.add-files }}
          COMMIT_MESSAGE: ${{ steps.params.outputs.commit-message }}
          PR_TITLE: ${{ steps.params.outputs.pr-title }}
          PR_BODY: ${{ steps.params.outputs.pr-body }}
        run: |
          for f in $ADD_FILES; do
            git add "$f"
          done

          if git diff --cached --quiet; then
            echo "No changes to commit — exiting."
            exit 0
          fi

          git commit -m "$COMMIT_MESSAGE"

          echo "Attempting direct push to $BUMP_BRANCH..."
          set +e
          push_output=$(git push origin "HEAD:$BUMP_BRANCH" --force 2>&1)
          push_rc=$?
          set -e

          if [ "$push_rc" -eq 0 ]; then
            echo "Direct push succeeded."

            # Check for existing PR from this branch and update or create.
            EXISTING_PR=$(gh pr list --base "$DEFAULT_BRANCH" --head "$BUMP_BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -n "$EXISTING_PR" ]; then
              echo "Updating existing PR #$EXISTING_PR."
              gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body "$PR_BODY"
            else
              echo "Creating new PR."
              gh pr create --title "$PR_TITLE" --body "$PR_BODY" --base "$DEFAULT_BRANCH" --head "$BUMP_BRANCH"
            fi
          elif echo "$push_output" | grep -qiE "protected branch|GH006|required status check"; then
            echo "Branch protection detected — falling back to temp branch + PR."

            SAFE_BRANCH="$BUMP_BRANCH-$(date +%s)"
            git checkout -b "$SAFE_BRANCH"
            git push origin "$SAFE_BRANCH"

            gh pr create --title "$PR_TITLE" --body "$PR_BODY" --base "$DEFAULT_BRANCH" --head "$SAFE_BRANCH"
          else
            printf '%s\n' "$push_output" >&2
            exit "$push_rc"
          fi