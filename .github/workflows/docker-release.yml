name: Docker Release

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to the Dockerfile, relative to the repository root.
        required: false
        type: string
        default: "./Dockerfile"
      image-name:
        description: >
          Image name published to the GitHub Container Registry, e.g.
          `ghcr.io/<owner>/<repo>` or `ghcr.io/<owner>/<repo>-sandbox`.
          When empty (the default), publishes to `ghcr.io/<owner>/<repo>`
          for the calling repository.
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    env:
      # Resolved once so the metadata, by-digest push and hardening base ref
      # all agree. Cannot be a workflow_call input default (Rule 5: dynamic
      # defaults are rejected), so it is computed here.
      IMAGE_NAME: ${{ inputs.image-name != '' && inputs.image-name || format('ghcr.io/{0}', github.repository) }}
    permissions:
      contents: read
      packages: write         # required to push images to ghcr.io
      id-token: write         # provenance/SBOM attestation signing (provenance: mode=max, sbom: true)
      attestations: write     # provenance/SBOM attestation signing
      security-events: write  # required to upload the Trivy SARIF to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Log in to GitHub Container Registry
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      # Stage 1 of the fleet-wide security-hardening build: build the
      # component's own Dockerfile and push it by digest only (no consumer
      # tag), so no un-patched image is ever tagged in the registry. The
      # digest gives Stage 2 a registry base to build FROM. Provenance/SBOM
      # are disabled here — they belong on the final (patched) image.
      - name: Build base image (push by digest, untagged)
        id: base
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      # Read the base image's configured USER so the hardening layer can run
      # apt as root and then restore the original user, leaving runtime
      # behaviour unchanged.
      - name: Inspect base image config
        env:
          BASE_REF: ${{ env.IMAGE_NAME }}@${{ steps.base.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$BASE_REF" \
            --format '{{json .Image}}' > /tmp/base-config.json

      - name: Render hardening Dockerfile
        env:
          BASE_REF: ${{ env.IMAGE_NAME }}@${{ steps.base.outputs.digest }}
        run: |
          mkdir -p /tmp/harden
          python3 scripts/render_harden_dockerfile.py \
            --base-ref "$BASE_REF" \
            --config /tmp/base-config.json \
            --out /tmp/harden/Dockerfile
          cat /tmp/harden/Dockerfile

      # Stage 2: build the hardening layer (apt security upgrade) on top of
      # the by-digest base and push it to the consumer tags WITH provenance +
      # SBOM. This is the image the Trivy gate below scans and consumers pull,
      # so it carries the patched packages (e.g. perl-base >= 5.40.1-6+deb13u1).
      - name: Build and push hardened image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: /tmp/harden
          file: /tmp/harden/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Resolve scan image tag
        id: scan-ref
        # Pass the metadata-action output via env, not inline ``${{ }}``
        # interpolation into the run block, to avoid template injection.
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "image=$(echo "$TAGS" | head -1)" >> "$GITHUB_OUTPUT"

      # Gate: only CRITICAL, fixable CVEs block the pipeline. Runs in
      # table format so the failing CVE row is visible in the CI log
      # (SARIF mode would silently swallow it — see below).
      - name: Trivy vulnerability scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.scan-ref.outputs.image }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      # Code-scanning surface: separate Trivy run that emits SARIF for
      # all severities (no exit-code). The two steps MUST stay separate:
      # the trivy-action's entrypoint unsets TRIVY_SEVERITY when
      # format=sarif (unless limit-severities-for-sarif=true), so
      # combining gate + SARIF into one step would silently scan for
      # ALL severities and fail on HIGH/MEDIUM findings the gate is
      # supposed to ignore. `if: always()` so we still surface findings
      # in the Security tab even when the gate above trips.
      - name: Trivy vulnerability scan (SARIF for code-scanning)
        uses: damien-robotsix/robotsix-github-workflows/.github/actions/trivy-sarif@0584b087d3ae384050ef06723d3f4e6e06d523da
        with:
          image-ref: ${{ steps.scan-ref.outputs.image }}
          ignore-unfixed: true
