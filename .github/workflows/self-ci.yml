name: Self CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint workflows (self)
    uses: ./.github/workflows/lint-workflows.yml
    with:
      run-actionlint: true
      run-zizmor: true

  baseline:
    name: Baseline (self)
    uses: ./.github/workflows/baseline-check.yml

  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run pin-bump tests
        run: pytest tests/test-pin-bump.py -v

      - name: Run config-ownership-check tests
        run: bash tests/test-config-ownership-check.sh
