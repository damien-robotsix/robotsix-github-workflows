# zizmor configuration (auto-discovered by `zizmor --persona=pedantic
# .github/workflows/` in lint-workflows.yml).
rules:
  excessive-permissions:
    ignore:
      # python-ci.yml intentionally has no workflow-level permissions block,
      # and its opt-in audit-sarif job declares none. That job inherits the
      # caller's token, so it gets security-events:write only when a caller
      # opts in with audit-sarif: true. Every other job there declares an
      # explicit `contents: read` block.
      - python-ci.yml
