name: Bump setup
description: |
  Shared prelude for the bump/release workflows: mints a GitHub App
  installation token, checks out the calling repository with it, installs
  uv, and sets the bot git identity. Centralizes the token/action/version
  pins so a shared concern (e.g. a create-github-app-token release or a
  setup-uv bump) needs one edit instead of four.
  The sweep workflow passes `checkout-token: false` because its sweep
  script talks to the GitHub API via the token in an env var rather than
  through git credentials. pin-bump.yml additionally checks out the
  workflow-library repo via `checkout-repository` / `checkout-path`.
inputs:
  app-id:
    description: GitHub App ID used to mint an installation token.
    required: true
  app-private-key:
    description: PEM private key of the GitHub App named by app-id.
    required: true
  uv-version:
    description: uv version to install.
    required: false
    default: "0.8.15"
  checkout-token:
    description: >
      Whether to pass the minted token to checkout. The push workflows
      need a credentialed checkout; the sweep does not.
    required: false
    default: "true"
  checkout-repository:
    description: Optional additional repository to check out.
    required: false
    default: ""
  checkout-path:
    description: Path for the additionally checked-out repository.
    required: false
    default: ""
outputs:
  token:
    description: The minted GitHub App installation token.
    value: ${{ steps.app-token.outputs.token }}
runs:
  using: composite
  steps:
    - name: Mint GitHub App installation token
      id: app-token
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        repositories: ${{ github.repository }}

    - name: Check out calling repository with bump credential
      if: inputs.checkout-token == 'true'
      # persist-credentials intentionally left at its default (true) via
      # this branch: the push workflows must push the bump branch with
      # the minted credential.
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        token: ${{ steps.app-token.outputs.token }}
        fetch-depth: 0

    - name: Check out calling repository without credential
      if: inputs.checkout-token != 'true'
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        persist-credentials: false

    - name: Check out workflow-library repository
      if: inputs.checkout-repository != ''
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        repository: ${{ inputs.checkout-repository }}
        path: ${{ inputs.checkout-path }}
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      with:
        version: ${{ inputs.uv-version }}

    - name: Set git identity
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
